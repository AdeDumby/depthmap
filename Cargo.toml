[workspace]
resolver = "3"
members = ["crates/depthmap-core", "crates/depthmap"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rustc-hash = "2"

# Fast iteration without a crawling debug build: optimise everything lightly,
# and dependencies (wgpu, winit, zstd) fully.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
